  about_kicker: "Profilo"
  about_title: "Esperienza hardware professionale e fondamenta ingegneristiche in crescita"
  about_lead: "Sono un progettista hardware elettronico embedded nell'area di Milano, con esperienza pratica nel portare le schede dai requisiti e dall'architettura allo schematico, al coordinamento del layout, al bring-up dei prototipi e alla validazione."
