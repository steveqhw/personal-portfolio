- role_en: "Electronic Hardware Designer — Employee"
  role_it: "Progettista Hardware Elettronico — Dipendente"
  employer_en: "Medical robotics company"
  employer_it: "Azienda di robotica medicale"
  place_en: "Brianza (MB), Italy · in-house R&D team"
  place_it: "Brianza (MB), Italia · team R&D interno"
  start: "2023"
  end: "2024"
  body_en: "As an in-house hardware engineer, I designed electronic hardware for a modular robotic platform in the minimally-invasive surgery field. I worked on multilayer and rigid-flex boards with controlled-impedance, GHz-range signal integrity and high-speed digital interfaces, defining requirements, architecture, schematics and PCB activities. I handled board bring-up, SMD rework, functional testing and lab validation, with design under IEC 60601-1 medical safety constraints and coordination of international suppliers."
  body_it: "Come ingegnere hardware interno all'azienda, ho progettato hardware elettronico per una piattaforma robotica modulare nell'ambito della chirurgia mininvasiva. Ho lavorato su schede multistrato e rigid-flex con impedenza controllata, signal integrity in banda GHz e interfacce digitali ad alta velocità, definendo requisiti, architettura, schematici e attività di PCB. Mi sono occupato di bring-up scheda, rework SMD, test funzionali e validazione in laboratorio, con progettazione secondo i vincoli di sicurezza medicale IEC 60601-1 e coordinamento di fornitori internazionali."
  tags: ["Altium", "Rigid-flex", "High-speed", "IEC 60601-1", "Bring-up"]

- role_en: "Electronic Hardware Designer — Employee"
  role_it: "Progettista Hardware Elettronico — Dipendente"
  employer_en: "Airfield ground lighting company"
  employer_it: "Azienda di illuminazione aeroportuale"
  place_en: "Brianza (MB), Italy · in-house R&D & production"
  place_it: "Brianza (MB), Italia · R&D e produzione interni"
  start: "2021"
  end: "2023"
  body_en: "As a full-time employee, I developed, improved and tested electronic systems for airfield ground lighting control and monitoring. I worked on power electronics, high-voltage AC loads, RMS/power measurement and control boards, with hands-on prototype assembly, SMD soldering, microscope rework and production testing to IPC workmanship practices. I handled troubleshooting, validation, supplier relationships, BOM and shortage management in a safety-relevant industrial environment."
  body_it: "Come dipendente a tempo pieno, ho sviluppato, migliorato e testato sistemi elettronici per il controllo e il monitoraggio dell'illuminazione aeroportuale a terra. Ho lavorato su elettronica di potenza, carichi AC ad alta tensione, misura RMS/potenza e schede di controllo, con assemblaggio prototipi, saldatura SMD, rework al microscopio e test di produzione secondo le pratiche IPC. Mi sono occupato di troubleshooting, validazione, rapporti con i fornitori, gestione BOM e shortage in un contesto industriale rilevante per la sicurezza."
  tags: ["Power electronics", "High-voltage", "RMS/Power", "RS485/MODBUS", "IPC"]
