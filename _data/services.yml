# Recruiter-oriented capability groups. Content is factual and avoids claims of
# certification or performance that are not supported by public evidence.

- id: "design"
  num: "01"
  title_en: "Hardware architecture, schematic and PCB"
  title_it: "Architettura hardware, schematico e PCB"
  body_en: "Requirements interpretation, component selection, schematic design and PCB work for multilayer and rigid-flex boards, including high-speed digital interfaces, controlled impedance and design-for-manufacture considerations."
  body_it: "Interpretazione dei requisiti, selezione componenti, progettazione dello schematico e attività PCB per schede multistrato e rigid-flex, incluse interfacce digitali ad alta velocità, impedenza controllata e considerazioni per la producibilità."
  evidence_tags: ["Altium Designer", "KiCad", "Multilayer PCB", "Rigid-flex"]

- id: "prototype"
  num: "02"
  title_en: "Prototype and board bring-up"
  title_it: "Prototipo e bring-up della scheda"
  body_en: "Hands-on prototype assembly support, SMD soldering, microscope rework, board-level modifications and bring-up firmware used to turn first articles into diagnosable hardware."
  body_it: "Supporto pratico all'assemblaggio dei prototipi, saldatura SMD, rework al microscopio, modifiche a livello scheda e firmware di bring-up per rendere i primi campioni hardware diagnosticabili."
  evidence_tags: ["SMD rework", "Board bring-up", "Embedded C/C++"]

- id: "validation"
  num: "03"
  title_en: "Laboratory test and validation"
  title_it: "Test e validazione in laboratorio"
  body_en: "Functional debugging and validation with oscilloscopes, logic analyzers, VNA, spectrum analyzer and EMI pre-compliance equipment, supported by test procedures and technical reporting."
  body_it: "Debug funzionale e validazione con oscilloscopi, analizzatori logici, VNA, analizzatore di spettro e strumentazione EMI pre-compliance, supportati da procedure di test e report tecnici."
  evidence_tags: ["Oscilloscope", "Logic analyzer", "VNA", "EMI pre-compliance"]

- id: "firmware"
  num: "04"
  title_en: "Embedded firmware for hardware integration"
  title_it: "Firmware embedded per l'integrazione hardware"
  body_en: "Embedded C/C++ for microcontroller-based board bring-up, peripheral integration and hardware validation across common serial and industrial interfaces."
  body_it: "C/C++ embedded per bring-up di schede a microcontrollore, integrazione delle periferiche e validazione hardware su comuni interfacce seriali e industriali."
  evidence_tags: ["I2C", "SPI", "UART", "CAN", "RS485"]

- id: "mechanical"
  num: "05"
  title_en: "Mechanical integration and enclosures"
  title_it: "Integrazione meccanica ed enclosure"
  body_en: "3D modelling and additive manufacturing for custom housings, PCB supports and connector panels, with attention to cabling, assembly and physical fit."
  body_it: "Modellazione 3D e produzione additiva per housing custom, supporti PCB e pannelli connettori, con attenzione a cablaggi, assemblaggio e integrazione fisica."
  evidence_tags: ["SolidWorks", "Autodesk Fusion", "FDM 3D print"]

- id: "production"
  num: "06"
  title_en: "Production and documentation support"
  title_it: "Supporto a produzione e documentazione"
  body_en: "BOM management, component alternatives, supplier coordination, production testing and technical documentation informed by IPC workmanship practices."
  body_it: "Gestione BOM, componenti alternativi, coordinamento fornitori, test di produzione e documentazione tecnica basati sulle pratiche di lavorazione IPC."
  evidence_tags: ["BOM", "Sourcing", "DFM/DFA/DFT", "IPC practices"]
