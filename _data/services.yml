# Servizi offerti (freelance). num = etichetta mono, icona = nome svg in main.js/CSS (opzionale)

- num: "01"
  title_en: "PCB design & layout"
  title_it: "Progettazione e layout PCB"
  body_en: "Multilayer and rigid-flex boards, high-speed digital, controlled impedance and signal integrity. Schematic capture and layout in Altium Designer and KiCad, ready for manufacturing (DFM/DFA/DFT)."
  body_it: "Schede multistrato e rigid-flex, digitale ad alta velocità, impedenza controllata e signal integrity. Schematico e layout in Altium Designer e KiCad, pronti per la produzione (DFM/DFA/DFT)."

- num: "02"
  title_en: "Prototyping & bring-up"
  title_it: "Prototipazione e bring-up"
  body_en: "Prototype assembly, SMD soldering and microscope rework, bodge wires, board-level fixes and firmware bring-up to get your first boards alive and trustworthy."
  body_it: "Assemblaggio prototipi, saldatura SMD e rework al microscopio, bodge wire, fix a livello scheda e bring-up firmware per rendere vive e affidabili le prime schede."

- num: "03"
  title_en: "Testing & validation"
  title_it: "Test e validazione"
  body_en: "Functional and production testing, lab debugging with oscilloscope, logic analyzer, VNA, spectrum analyzer and EMI pre-compliance. Clear test procedures and technical reports."
  body_it: "Test funzionali e di produzione, debug in laboratorio con oscilloscopio, analizzatore logico, VNA, analizzatore di spettro ed EMI pre-compliance. Procedure di test e report tecnici chiari."

- num: "04"
  title_en: "Embedded firmware"
  title_it: "Firmware embedded"
  body_en: "Embedded C/C++ for microcontroller-based systems and board bring-up. Drivers for I2C, SPI, UART, CAN, RS485 and sensor interfaces, with AI-assisted review under direct technical ownership."
  body_it: "C/C++ embedded per sistemi a microcontrollore e bring-up scheda. Driver per I2C, SPI, UART, CAN, RS485 e interfacce sensori, con review AI-assistita sotto pieno controllo tecnico."

- num: "05"
  title_en: "3D modeling & enclosures"
  title_it: "Modellazione 3D ed enclosure"
  body_en: "Custom enclosures, housings, PCB supports and connector panels designed in SolidWorks / Fusion and 3D printed — real mechanical integration, not just the board."
  body_it: "Enclosure custom, housing, supporti PCB e pannelli connettori progettati in SolidWorks / Fusion e stampati in 3D — integrazione meccanica reale, non solo la scheda."

- num: "06"
  title_en: "Sourcing & documentation"
  title_it: "Sourcing e documentazione"
  body_en: "BOM management, component selection and alternatives, supplier coordination, shortage handling and complete technical documentation following IPC workmanship practices."
  body_it: "Gestione BOM, selezione componenti e alternative, coordinamento fornitori, gestione shortage e documentazione tecnica completa secondo le pratiche IPC."
