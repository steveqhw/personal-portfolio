---
---
{% assign lang = page.lang | default: site.lang %}
{% assign t = site.data.ui[lang] %}
<!doctype html>
<html lang="{{ lang }}">
  {% include head.html lang=lang t=t %}
  <body>
    <a class="skip-link" href="#main">{{ t.skip_to_content }}</a>
    {% include header.html lang=lang t=t %}
    <main id="main">
      {{ content }}
    </main>
    {% include footer.html lang=lang t=t %}
    <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
  </body>
</html>
